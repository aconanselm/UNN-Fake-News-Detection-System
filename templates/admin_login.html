<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login - UNN Fake News Detection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="masthead masthead-compact">
        <div class="logo">
            <img src="{{ url_for('static', filename='img/unn-logo.png') }}" alt="University of Nigeria, Nsukka crest" class="logo-crest">
            <span class="logo-text">UNN&nbsp;CFND</span>
        </div>
        <p class="masthead-label">University of Nigeria, Nsukka</p>
        <h1 class="masthead-title-small">Admin Login</h1>
    </header>

    <main class="container">
        <form class="submit-card" action="/admin/login" method="POST">
            {% if error %}
                <p class="form-error">{{ error }}</p>
            {% endif %}
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="text-input" autofocus required>
            <button type="submit" class="submit-button">Log in</button>
        </form>
        <a href="/" class="back-link">&larr; Back to the detector</a>
    </main>
</body>
</html>
